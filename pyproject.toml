[project]
name = "everos-mcp"
version = "0.1.0"
description = "MCP server for EverOS — long-term memory for AI agents, backed by the EverOS Cloud Memory API (v2)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EverMind AI", email = "service@evermind.ai" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.14.0,<2",  # floor tested in CI; 1.7-1.13 cannot register these tools
    "httpx>=0.27.0,<1",
]
keywords = ["mcp", "model-context-protocol", "memory", "long-term-memory", "ai-agents", "claude", "everos", "evermind"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://evermind.ai"
Documentation = "https://docs.evermind.ai"
Repository = "https://github.com/EverMind-AI/EverOS-MCP"
Issues = "https://github.com/EverMind-AI/EverOS-MCP/issues"
Console = "https://everos.evermind.ai"

[project.scripts]
everos-mcp = "everos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everos_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
