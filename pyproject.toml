[project]
name = "everos-mcp"
version = "0.1.0"
description = "MCP server for EverOS — long-term memory for AI agents, backed by the EverOS Cloud Memory API (v2)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "EverMind AI", email = "service@evermind.ai" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]
keywords = ["mcp", "memory", "ai-agents", "everos", "evermind"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://evermind.ai"
Documentation = "https://docs.evermind.ai"
Repository = "https://github.com/EverMind-AI/everos-mcp"

[project.scripts]
everos-mcp = "everos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everos_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
