name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: pytest against the minimum supported mcp
        if: matrix.python == '3.10'
        run: uv run --isolated --with "mcp==1.14.0" --with pytest --with-editable . pytest -q
